name: cineclaw

services:
  frontend:
    image: ghcr.io/cineclaw/frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    depends_on:
      - imdb-indexer
      - tracker-proxy
      - cineclaw-ai
    networks:
      - cineclaw-net

  imdb-indexer:
    image: ghcr.io/cineclaw/imdb-indexer:${IMAGE_TAG:-latest}
    container_name: imdb-indexer
    restart: unless-stopped
    ports:
      - "${PORT_INDEXER:-8090}:8090"
    volumes:
      - ${DATA_DIR:-./data}/imdb-indexer:/data
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-db85bce5bf5bf9bac3c140447bf5ac5d}
      - DATA_DIR=/data
    networks:
      - cineclaw-net

  tracker-proxy:
    image: ghcr.io/cineclaw/tracker-proxy:${IMAGE_TAG:-latest}
    container_name: tracker-proxy
    restart: unless-stopped
    ports:
      - "${PORT_PROXY:-9118}:9118"
    volumes:
      - ${DATA_DIR:-./data}/tracker-proxy/config.yaml:/app/config.yaml
      - ${DATA_DIR:-./data}/tracker-proxy/cache:/app/cache
      - ${DATA_DIR:-./data}/tracker-proxy/db:/app/data
    environment:
      - CONFIG_PATH=/app/config.yaml
      - TORRSERVER_URL=http://torrserver:8090
      - MEDIA_DB_PATH=/app/data/cineclaw.db
      - CACHE_PATH=/app/cache/cache.db
      - IMDB_INDEXER_URL=http://imdb-indexer:8090
      - NNMCLUB_USERNAME=${NNMCLUB_USERNAME:-}
      - NNMCLUB_PASSWORD=${NNMCLUB_PASSWORD:-}
      - RUTRACKER_USERNAME=${RUTRACKER_USERNAME:-}
      - RUTRACKER_PASSWORD=${RUTRACKER_PASSWORD:-}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-wavemp3}
      - AUTH_SECRET=${AUTH_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - flaresolverr
      - torrserver
      - imdb-indexer
    networks:
      - cineclaw-net

  cineclaw-ai:
    image: ghcr.io/cineclaw/cineclaw-ai:${IMAGE_TAG:-latest}
    container_name: cineclaw-ai
    restart: unless-stopped
    ports:
      - "${PORT_AI:-9120}:9120"
    volumes:
      - ${DATA_DIR:-./data}/cineclaw-ai:/data/cineclaw-ai
    environment:
      - PORT=9120
      - DATA_DIR=/data/cineclaw-ai
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-db85bce5bf5bf9bac3c140447bf5ac5d}
      - AI_SUMMARY_MODEL=${AI_SUMMARY_MODEL:-google/gemini-2.5-flash}
      - AI_COMPACT_MODEL=${AI_COMPACT_MODEL:-google/gemini-2.5-flash-lite}
      - AI_AGENT_MODEL=${AI_AGENT_MODEL:-google/gemini-2.5-flash}
    networks:
      - cineclaw-net

  torrserver:
    image: ghcr.io/cineclaw/torrserver-gst:${IMAGE_TAG:-latest}
    container_name: torrserver
    restart: unless-stopped
    ports:
      - "${PORT_TORRSERVER:-8092}:8090"
    volumes:
      - ${DATA_DIR:-./data}/torrserver:/opt/ts/db
      - ${DATA_DIR:-./data}/torrserver/torrents:/opt/ts/torrents
    environment:
      - TS_PORT=8090
      - TS_PATH=/opt/ts/db
      - TS_TORRENTSDIR=/opt/ts/torrents
      - TS_DONTKILL=1
    networks:
      - cineclaw-net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "${PORT_FLARESOLVERR:-8191}:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Europe/Moscow}
    networks:
      - cineclaw-net

  lodestarr:
    image: ghcr.io/ddonindia/lodestarr:master
    container_name: lodestarr
    restart: unless-stopped
    ports:
      - "${PORT_LODESTARR:-3420}:3420"
    volumes:
      - ${DATA_DIR:-./data}/lodestarr:/root/.config/lodestarr
    environment:
      - RUST_LOG=info
    networks:
      - cineclaw-net

networks:
  cineclaw-net:
    name: cineclaw-net
    driver: bridge
